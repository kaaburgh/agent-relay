name: Temporary pip 12999 static review

on:
  push:
    branches:
      - tmp-pip-12999-tests

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pip branch
        uses: actions/checkout@v4
        with:
          repository: kaaburgh/pip
          ref: issue-12999-implementation
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install .
      - run: python -m pip install nox
      - name: Typecheck changed code and tests
        run: >-
          python -m nox -s typecheck --
          src/pip/_internal/index/package_finder.py
          src/pip/_internal/resolution/resolvelib/factory.py
          tests/unit/test_finder.py
          tests/functional/test_new_resolver_errors.py
      - name: Run pre-commit
        run: python -m nox -s lint
