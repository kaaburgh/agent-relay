name: Temporary pip 12999 tests

on:
  push:
    branches:
      - tmp-pip-12999-tests

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pip branch
        uses: actions/checkout@v4
        with:
          repository: kaaburgh/pip
          ref: issue-12999-implementation
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install .
      - run: python -m pip install nox
      - name: Run relevant regression tests
        run: >-
          python -m nox -s test-3.13 --
          tests/unit/test_finder.py
          tests/functional/test_new_resolver_errors.py
          tests/functional/test_install_format_control.py
          --verbose --showlocals
